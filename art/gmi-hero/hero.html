<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMI Cloud — General Machine Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --ink: #ffffff;
    --ink-dim: #9a9a9a;
    --lime: #d4f541;
    --line: rgba(255, 255, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  /* ─────────── NAV ─────────── */
  nav {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 56px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 22px;
    letter-spacing: -0.02em;
  }
  .logo svg { width: 26px; height: 26px; }
  .nav-mid {
    display: flex; gap: 40px;
    font-size: 14px; font-weight: 500;
    color: var(--ink);
    margin-left: 48px;
    flex: 1;
  }
  .nav-mid a {
    color: inherit; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .2s;
  }
  .nav-mid a:hover { color: var(--lime); }
  .nav-mid .caret { font-size: 10px; opacity: 0.6; }
  .nav-right { display: flex; gap: 12px; align-items: center; }
  .lang {
    color: var(--ink); font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px;
    margin-right: 12px; cursor: pointer;
  }
  .lang .caret { font-size: 10px; opacity: 0.6; }
  .btn {
    font-family: inherit; font-weight: 600;
    font-size: 13px; letter-spacing: 0.06em;
    padding: 11px 22px;
    border-radius: 4px;
    border: 1px solid var(--ink);
    cursor: pointer;
    transition: all .15s ease;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink);
  }
  .btn-lime {
    background: var(--lime);
    color: var(--bg);
    border-color: var(--lime);
  }
  .btn-lime:hover { background: #c2e234; border-color: #c2e234; }
  .btn-outline:hover { background: rgba(255,255,255,0.06); }

  /* ─────────── HERO ─────────── */
  .hero {
    position: relative;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 40px;
    padding: 60px 56px 80px;
    min-height: calc(100vh - 80px);
    align-items: center;
  }

  .left { z-index: 2; }

  /* NVIDIA eyebrow */
  .eyebrow {
    display: inline-flex;
    align-items: stretch;
    background: var(--ink);
    color: var(--bg);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 64px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .eyebrow .e-text {
    padding: 8px 14px;
    display: flex; align-items: center;
  }
  .eyebrow .e-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg);
    color: var(--ink);
    padding: 4px 10px;
    margin: 4px 4px 4px 0;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.04em;
  }
  .eyebrow .nv-eye {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #76b900 0%, #5a8a00 70%);
    box-shadow: 0 0 0 1px #76b900;
    flex-shrink: 0;
  }
  .eyebrow .nv-stack { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
  .eyebrow .nv-name { font-size: 9px; }
  .eyebrow .nv-tier { font-size: 7px; opacity: 0.85; font-weight: 500; }

  /* Headline */
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(48px, 7.8vw, 124px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-bottom: 48px;
  }
  h1 .word {
    display: block;
    position: relative;
  }
  h1 .first {
    color: var(--lime);
  }
  h1 .rest { color: var(--ink); }

  /* Slice glitch — applied to ANY .glitch span. Renders three stacked copies
     with mask-image scanlines that animate slowly, like an inference pass
     decoding the text. The base copy stays fully legible underneath. */
  .glitch {
    position: relative;
    display: inline-block;
    isolation: isolate;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    color: inherit;
    pointer-events: none;
  }
  .glitch::before {
    -webkit-mask-image: repeating-linear-gradient(to bottom,
      #000 0, #000 6px, transparent 6px, transparent 9px,
      #000 9px, #000 18px, transparent 18px, transparent 21px);
    mask-image: repeating-linear-gradient(to bottom,
      #000 0, #000 6px, transparent 6px, transparent 9px,
      #000 9px, #000 18px, transparent 18px, transparent 21px);
    transform: translateX(-2px);
    mix-blend-mode: difference;
    animation: sliceA 9.5s ease-in-out infinite;
  }
  .glitch::after {
    -webkit-mask-image: repeating-linear-gradient(to bottom,
      transparent 0, transparent 14px, #000 14px, #000 17px,
      transparent 17px, transparent 28px, #000 28px, #000 31px);
    mask-image: repeating-linear-gradient(to bottom,
      transparent 0, transparent 14px, #000 14px, #000 17px,
      transparent 17px, transparent 28px, #000 28px, #000 31px);
    transform: translateX(2px);
    mix-blend-mode: difference;
    animation: sliceB 9.5s ease-in-out infinite;
  }
  @keyframes sliceA {
    0%, 88%, 100% { opacity: 0.85; transform: translateX(-2px); }
    91%           { opacity: 1;    transform: translateX(-3px); }
    93%           { opacity: 0.4;  transform: translateX(0); }
    96%           { opacity: 1;    transform: translateX(-2px); }
  }
  @keyframes sliceB {
    0%, 88%, 100% { opacity: 0.7; transform: translateX(2px); }
    91%           { opacity: 1;   transform: translateX(3px); }
    94%           { opacity: 0.3; transform: translateX(0); }
    97%           { opacity: 1;   transform: translateX(2px); }
  }

  /* Subhead */
  .sub {
    font-size: clamp(15px, 1.18vw, 18px);
    line-height: 1.55;
    color: var(--ink-dim);
    max-width: 60ch;
    margin-bottom: 40px;
  }

  /* CTAs */
  .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .cta {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 18px 28px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid;
    display: inline-flex; align-items: center; gap: 12px;
    transition: all .15s ease;
  }
  .cta-primary {
    background: var(--lime);
    color: var(--bg);
    border-color: var(--lime);
  }
  .cta-primary:hover { background: #c2e234; border-color: #c2e234; transform: translateY(-1px); }
  .cta-outline {
    background: transparent;
    color: var(--ink);
    border-color: var(--ink);
  }
  .cta-outline:hover { background: rgba(255,255,255,0.06); }
  .cta .arr {
    display: inline-block;
    transition: transform .15s ease;
    transform: rotate(-45deg);
  }
  .cta:hover .arr { transform: rotate(-45deg) translate(2px, -2px); }

  /* ─────────── RIGHT: 3D LATTICE CANVAS ─────────── */
  .right {
    position: relative;
    z-index: 1;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 520px;
  }
  #scene {
    width: 100%;
    height: 100%;
    min-height: 520px;
    display: block;
  }

  /* Mobile */
  @media (max-width: 960px) {
    nav { padding: 18px 22px; }
    .nav-mid { display: none; }
    .nav-right .lang { display: none; }
    .hero {
      grid-template-columns: 1fr;
      padding: 28px 22px 60px;
      gap: 24px;
    }
    .right { min-height: 320px; }
    #scene { min-height: 320px; }
    .eyebrow { margin-bottom: 36px; }
    h1 { margin-bottom: 28px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 14a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.4A4 4 0 0 1 19 14"/>
      <path d="M3 18h18M3 21h18"/>
    </svg>
    GMI
  </div>
  <div class="nav-mid">
    <a href="#">Models <span class="caret">▾</span></a>
    <a href="#">GPUs</a>
    <a href="#">Customers</a>
    <a href="#">Pricing</a>
    <a href="#">Company <span class="caret">▾</span></a>
  </div>
  <div class="nav-right">
    <span class="lang">English <span class="caret">▾</span></span>
    <button class="btn btn-lime">LOGIN</button>
    <button class="btn btn-outline">CONTACT SALES</button>
  </div>
</nav>

<section class="hero">
  <div class="left">
    <div class="eyebrow">
      <span class="e-text">Powered by NVIDIA</span>
      <span class="e-badge">
        <span class="nv-eye"></span>
        <span class="nv-stack">
          <span class="nv-name">NVIDIA</span>
          <span class="nv-tier">Preferred Partner</span>
        </span>
      </span>
    </div>

    <h1>
      <span class="word"><span class="first glitch" data-text="G">G</span><span class="rest glitch" data-text="eneral">eneral</span></span>
      <span class="word"><span class="first glitch" data-text="M">M</span><span class="rest glitch" data-text="achine">achine</span></span>
      <span class="word"><span class="first glitch" data-text="I">I</span><span class="rest glitch" data-text="ntelligence">ntelligence</span></span>
    </h1>

    <p class="sub">
      An AI-native inference cloud built for production AI, combining
      serverless scaling and dedicated GPU infrastructure with predictable
      performance and cost.
    </p>

    <div class="ctas">
      <button class="cta cta-primary">Start in console <span class="arr">↑</span></button>
      <button class="cta cta-outline">Contact sales</button>
    </div>
  </div>

  <div class="right">
    <canvas id="scene"></canvas>
  </div>
</section>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// 3D INFERENCE LATTICE
// A small, slowly rotating wireframe lattice of GPU nodes. Token particles
// traverse the edges, lighting them up briefly. When a particle reaches a
// node, it emits a starburst of "+" sparks (echoing the NVIDIA-grid aesthetic
// in the original hero, but alive — the verb of inference, not just the noun
// of infrastructure).
// Pure vanilla canvas, DPR-aware, ~60fps, tab-pause, reduced-motion aware.
// ═══════════════════════════════════════════════════════════════════════════
(function () {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const LIME = '#d4f541';
  const LIME_DIM = 'rgba(212, 245, 65, 0.32)';
  const LIME_SOFT = 'rgba(212, 245, 65, 0.10)';
  const WHITE_DIM = 'rgba(255, 255, 255, 0.18)';

  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0;
  let focal = 800;

  // ── Build a 3D lattice of nodes (GPU positions) ────────────────────────
  // 4 × 3 × 4 grid, normalized around origin.
  const GX = 4, GY = 3, GZ = 4;
  const SP = 70; // spacing in scene units
  const nodes = [];
  for (let ix = 0; ix < GX; ix++) {
    for (let iy = 0; iy < GY; iy++) {
      for (let iz = 0; iz < GZ; iz++) {
        nodes.push({
          ix, iy, iz,
          x: (ix - (GX - 1) / 2) * SP,
          y: (iy - (GY - 1) / 2) * SP,
          z: (iz - (GZ - 1) / 2) * SP,
          flash: 0
        });
      }
    }
  }
  const idxOf = (ix, iy, iz) => ix * GY * GZ + iy * GZ + iz;

  // Edges: each node connected to its +x, +y, +z neighbor only (avoids dupes)
  const edges = [];
  for (let ix = 0; ix < GX; ix++) {
    for (let iy = 0; iy < GY; iy++) {
      for (let iz = 0; iz < GZ; iz++) {
        const a = idxOf(ix, iy, iz);
        if (ix < GX - 1) edges.push({ a, b: idxOf(ix + 1, iy, iz), heat: 0 });
        if (iy < GY - 1) edges.push({ a, b: idxOf(ix, iy + 1, iz), heat: 0 });
        if (iz < GZ - 1) edges.push({ a, b: idxOf(ix, iy, iz + 1), heat: 0 });
      }
    }
  }
  // Adjacency map: node → outgoing edge indices
  const adj = nodes.map(() => []);
  edges.forEach((e, i) => { adj[e.a].push(i); adj[e.b].push(i); });

  // ── Token particles traversing edges ──────────────────────────────────
  // Each particle: which edge, direction (a→b or b→a), progress 0..1, speed.
  const PARTICLE_COUNT = 14;
  const particles = [];
  function spawnParticle() {
    const ei = Math.floor(Math.random() * edges.length);
    return {
      ei,
      dir: Math.random() < 0.5 ? 1 : -1,
      t: Math.random(),
      speed: 0.005 + Math.random() * 0.008
    };
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(spawnParticle());

  // ── Sparks ("+" marks emitted on capture) ─────────────────────────────
  const sparks = [];
  function emitSparks(x3, y3, z3, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const b = Math.random() * Math.PI * 2;
      const sp = 0.4 + Math.random() * 1.6;
      sparks.push({
        x: x3, y: y3, z: z3,
        vx: Math.cos(a) * Math.cos(b) * sp,
        vy: Math.sin(b) * sp,
        vz: Math.sin(a) * Math.cos(b) * sp,
        life: 1
      });
    }
  }

  // ── Static dust "+" cluster (the ambient grid in the original screenshot) ─
  // Seeded deterministic positions in a shell around the lattice.
  const dust = [];
  let dseed = 0xC0DECAFE;
  function dRand() { dseed = (dseed * 1664525 + 1013904223) >>> 0; return (dseed & 0xffff) / 0xffff; }
  for (let i = 0; i < 220; i++) {
    const r = SP * (2.4 + dRand() * 2.6);
    const theta = dRand() * Math.PI * 2;
    const phi = (dRand() - 0.5) * Math.PI * 1.1;
    dust.push({
      x: Math.cos(theta) * Math.cos(phi) * r,
      y: Math.sin(phi) * r * 0.6,
      z: Math.sin(theta) * Math.cos(phi) * r,
      size: 0.7 + dRand() * 0.8
    });
  }

  // ── Camera rotation ────────────────────────────────────────────────────
  let yaw = -0.55;       // initial angle
  const pitch = 0.32;    // tilt down a touch
  const yawSpeed = 0.0018;

  function project(p) {
    // rotate around Y by yaw, then around X by pitch
    const cy_ = Math.cos(yaw), sy_ = Math.sin(yaw);
    const x1 = p.x * cy_ + p.z * sy_;
    const z1 = -p.x * sy_ + p.z * cy_;
    const cx_ = Math.cos(pitch), sx_ = Math.sin(pitch);
    const y1 = p.y * cx_ - z1 * sx_;
    const z2 =  p.y * sx_ + z1 * cx_;
    const k = focal / (focal + z2);
    return { sx: cx + x1 * k, sy: cy + y1 * k, depth: z2, scale: k };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = Math.max(320, r.width);
    H = Math.max(320, r.height);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5;
    cy = H * 0.55;
    focal = Math.max(W, H) * 0.95;
  }

  let running = true;
  function frame() {
    if (!running) return;
    yaw += yawSpeed;

    // Clear (the page bg shows through)
    ctx.clearRect(0, 0, W, H);

    // Project nodes + decay flash
    const np = nodes.map(n => {
      n.flash *= 0.92;
      return project(n);
    });

    // Update & cool edges
    for (let i = 0; i < edges.length; i++) edges[i].heat *= 0.93;

    // Move particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.t += p.speed * p.dir;
      const e = edges[p.ei];
      // Heat the edge near the particle
      e.heat = Math.max(e.heat, 0.6 + Math.abs(p.t - 0.5) * -0.4);

      if (p.t >= 1 || p.t <= 0) {
        // Arrived at a node — flash it, emit sparks, pick next edge
        const arrivedNodeIdx = (p.t >= 1) ? e.b : e.a;
        const arrived = nodes[arrivedNodeIdx];
        arrived.flash = Math.min(1, arrived.flash + 1);
        emitSparks(arrived.x, arrived.y, arrived.z, 5);

        // Choose a new outgoing edge from this node
        const outs = adj[arrivedNodeIdx];
        const next = outs[Math.floor(Math.random() * outs.length)];
        const nextEdge = edges[next];
        const startsAtA = (nextEdge.a === arrivedNodeIdx);
        p.ei = next;
        p.dir = startsAtA ? 1 : -1;
        p.t = startsAtA ? 0.001 : 0.999;
        p.speed = 0.004 + Math.random() * 0.009;
      }
    }

    // ── Draw order: back dust → edges → cubes → particles → flashes → front dust ─

    // 1. Back-half dust
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const pr = project(d);
      if (pr.depth <= 0) continue; // back half = positive depth (behind everything)
      const a = Math.max(0, Math.min(0.5, 0.4 - pr.depth / 600));
      drawPlus(pr.sx, pr.sy, d.size * pr.scale * 1.4, `rgba(255,255,255,${a.toFixed(3)})`);
    }

    // 2. Edges (sorted back-to-front)
    const edgeDraws = [];
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      const pa = np[e.a], pb = np[e.b];
      edgeDraws.push({ pa, pb, heat: e.heat, depth: (pa.depth + pb.depth) * 0.5 });
    }
    edgeDraws.sort((u, v) => v.depth - u.depth);
    for (let i = 0; i < edgeDraws.length; i++) {
      const ed = edgeDraws[i];
      const heat = ed.heat;
      if (heat > 0.05) {
        ctx.strokeStyle = `rgba(212,245,65,${(0.25 + heat * 0.7).toFixed(3)})`;
        ctx.lineWidth = 1 + heat * 1.2;
      } else {
        ctx.strokeStyle = WHITE_DIM;
        ctx.lineWidth = 0.7;
      }
      ctx.beginPath();
      ctx.moveTo(ed.pa.sx, ed.pa.sy);
      ctx.lineTo(ed.pb.sx, ed.pb.sy);
      ctx.stroke();
    }

    // 3. Cube wireframes at each node
    const CUBE = 7; // half-size in scene units
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const corners = cubeCorners(n.x, n.y, n.z, CUBE).map(project);
      const flash = n.flash;
      ctx.strokeStyle = flash > 0.05
        ? `rgba(212,245,65,${Math.min(1, 0.5 + flash * 0.6).toFixed(3)})`
        : 'rgba(212,245,65,0.7)';
      ctx.lineWidth = flash > 0.05 ? 1.4 : 1;
      drawCubeEdges(corners);
      // tiny center dot
      const pn = np[i];
      ctx.fillStyle = flash > 0.2 ? LIME : 'rgba(212,245,65,0.55)';
      const r = 1.4 + flash * 1.6;
      ctx.beginPath();
      ctx.arc(pn.sx, pn.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Particles (riding edges)
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const e = edges[p.ei];
      const a = nodes[e.a], b = nodes[e.b];
      const t = p.t;
      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      const z = a.z + (b.z - a.z) * t;
      const pr = project({ x, y, z });
      // Trail + head
      ctx.fillStyle = LIME;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, 2.4 * pr.scale, 0, Math.PI * 2);
      ctx.fill();
      // Glow
      ctx.fillStyle = LIME_SOFT;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, 7 * pr.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 5. Sparks (capture starbursts)
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.z += s.vz;
      s.vy += 0.02;
      s.life -= 0.022;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      const pr = project(s);
      drawPlus(pr.sx, pr.sy, 2.8 * pr.scale, `rgba(212,245,65,${(s.life * 0.9).toFixed(3)})`);
    }

    // 6. Front-half dust
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      const pr = project(d);
      if (pr.depth > 0) continue;
      const a = Math.max(0, Math.min(0.85, 0.7 + pr.depth / 600));
      drawPlus(pr.sx, pr.sy, d.size * pr.scale * 1.4, `rgba(255,255,255,${a.toFixed(3)})`);
    }

    requestAnimationFrame(frame);
  }

  function cubeCorners(x, y, z, h) {
    return [
      { x: x - h, y: y - h, z: z - h },
      { x: x + h, y: y - h, z: z - h },
      { x: x + h, y: y + h, z: z - h },
      { x: x - h, y: y + h, z: z - h },
      { x: x - h, y: y - h, z: z + h },
      { x: x + h, y: y - h, z: z + h },
      { x: x + h, y: y + h, z: z + h },
      { x: x - h, y: y + h, z: z + h },
    ];
  }
  const CUBE_EDGES = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  function drawCubeEdges(c) {
    ctx.beginPath();
    for (let i = 0; i < CUBE_EDGES.length; i++) {
      const [a, b] = CUBE_EDGES[i];
      ctx.moveTo(c[a].sx, c[a].sy);
      ctx.lineTo(c[b].sx, c[b].sy);
    }
    ctx.stroke();
  }

  function drawPlus(x, y, s, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.6, s * 0.45);
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x + s, y);
    ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
    ctx.stroke();
  }

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) requestAnimationFrame(frame);
  });

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('resize', resize);
  resize();
  // Need a ResizeObserver for layout-driven changes (sidebar, fonts loading)
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(canvas);
  }

  if (reduce) {
    // Render a single static frame
    yawSpeed && (function staticOnce() {
      for (let k = 0; k < 1; k++) frame();
      running = false;
    })();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
