<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice Flux — General Machine Intelligence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px; font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px; margin-bottom: 32px; line-height: 1.5;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before {
            content: '•'; color: var(--anthropic-orange); font-weight: bold;
        }
        .seed-input {
            width: 100%; background: var(--anthropic-light);
            padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none; border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white;
        }
        .seed-controls {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
        }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--anthropic-dark); margin-bottom: 8px;
        }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] {
            flex: 1; height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px; outline: none; -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: var(--anthropic-orange); border-radius: 50%;
            cursor: pointer; transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1); background: #c86641;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px; background: var(--anthropic-orange);
            border-radius: 50%; border: none; cursor: pointer;
        }
        .value-display {
            font-family: 'Courier New', monospace; font-size: 12px;
            color: var(--anthropic-mid-gray); min-width: 60px; text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block; font-size: 12px;
            color: var(--anthropic-mid-gray); margin-bottom: 4px;
        }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] {
            width: 32px; height: 32px; border: none; border-radius: 6px;
            cursor: pointer; background: none; padding: 0;
        }
        .color-value {
            font-family: 'Courier New', monospace; font-size: 12px;
            color: var(--anthropic-mid-gray);
        }
        .button {
            background: var(--anthropic-orange); color: white; border: none;
            padding: 10px 16px; border-radius: 6px;
            font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0;
        }
        #canvas-container {
            width: 100%; max-width: 1000px;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: #faf9f5;
        }
        #canvas-container canvas {
            display: block; width: 100% !important; height: auto !important;
        }
        .loading {
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--anthropic-mid-gray); padding: 200px 0;
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Lattice Flux</h1>
            <div class="subtitle">General Machine Intelligence — inference particles flowing through a hidden capture lattice. Predictable throughput, unpredictable individuals.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="73420" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— concurrent requests</span></label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="200" max="3000" step="100" value="1200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Lattice Spacing <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— GPU density</span></label>
                    <div class="slider-container">
                        <input type="range" id="latticeSpacing" min="40" max="160" step="5" value="80" oninput="updateParam('latticeSpacing', this.value)">
                        <span class="value-display" id="latticeSpacing-value">80</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Strength <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— demand pressure</span></label>
                    <div class="slider-container">
                        <input type="range" id="flowStrength" min="0.1" max="2.0" step="0.05" value="0.8" oninput="updateParam('flowStrength', this.value)">
                        <span class="value-display" id="flowStrength-value">0.8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Capture Radius <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— utilization</span></label>
                    <div class="slider-container">
                        <input type="range" id="captureRadius" min="10" max="60" step="1" value="28" oninput="updateParam('captureRadius', this.value)">
                        <span class="value-display" id="captureRadius-value">28</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Echo Offset <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— residual pass</span></label>
                    <div class="slider-container">
                        <input type="range" id="echoOffset" min="0" max="6" step="0.1" value="2.2" oninput="updateParam('echoOffset', this.value)">
                        <span class="value-display" id="echoOffset-value">2.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Decay <span style="color:var(--anthropic-mid-gray);font-weight:400;font-size:11px">— cost predictability</span></label>
                    <div class="slider-container">
                        <input type="range" id="decay" min="0.001" max="0.02" step="0.001" value="0.005" oninput="updateParam('decay', this.value)">
                        <span class="value-display" id="decay-value">0.005</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.0005" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Compute (warm)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Flow (cool)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Echo (residual)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#788c5d</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing lattice…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // LATTICE FLUX
        // Inference particles flowing into a hidden capture lattice (the GPU
        // substrate). Demand arrives chaotically at the perimeter; the lattice
        // folds it into predictable pulses. Each primary stroke is shadowed by
        // a faint echo trail — the residual inference pass.
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 73420,
            particleCount: 1200,
            latticeSpacing: 80,
            flowStrength: 0.8,
            captureRadius: 28,
            echoOffset: 2.2,
            decay: 0.005,
            noiseScale: 0.004,
            colorPalette: ['#d97757', '#6a9bcc', '#788c5d']
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let particles = [];
        let lattice = [];
        let pulses = [];
        let cWarm, cCool, cEcho;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            cWarm = color(params.colorPalette[0]);
            cCool = color(params.colorPalette[1]);
            cEcho = color(params.colorPalette[2]);

            generateLattice();

            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }
            pulses = [];

            background(250, 249, 245);
        }

        function generateLattice() {
            lattice = [];
            const s = params.latticeSpacing;
            const offset = s * 0.5;
            let row = 0;
            for (let y = offset; y < height; y += s) {
                const rowOff = (row % 2) * (s * 0.5);
                for (let x = offset; x < width; x += s) {
                    const jx = (noise(x * 0.012, y * 0.012) - 0.5) * s * 0.18;
                    const jy = (noise(x * 0.012 + 100, y * 0.012 + 100) - 0.5) * s * 0.18;
                    const px = x + rowOff + jx;
                    const py = y + jy;
                    if (px > 0 && px < width && py > 0 && py < height) {
                        lattice.push({ x: px, y: py });
                    }
                }
                row++;
            }
        }

        class Particle {
            constructor() {
                this.spawn();
            }
            spawn() {
                const edge = floor(random(4));
                if (edge === 0)      { this.x = -5;        this.y = random(height); this.vx =  random(0.6, 1.4); this.vy = random(-0.4, 0.4); }
                else if (edge === 1) { this.x = width + 5; this.y = random(height); this.vx = -random(0.6, 1.4); this.vy = random(-0.4, 0.4); }
                else if (edge === 2) { this.x = random(width); this.y = -5;          this.vx = random(-0.4, 0.4); this.vy =  random(0.6, 1.4); }
                else                 { this.x = random(width); this.y = height + 5; this.vx = random(-0.4, 0.4); this.vy = -random(0.6, 1.4); }
                this.px = this.x; this.py = this.y;
                this.life = random(0.85, 1.0);
                this.captures = 0;
                this.cooldown = 0;
            }
            step() {
                this.px = this.x; this.py = this.y;

                // Flow field — layered Perlin noise
                const ang = noise(this.x * params.noiseScale, this.y * params.noiseScale, frameCount * 0.0015) * TWO_PI * 2.0;
                const flowAccel = params.flowStrength * 0.06;
                this.vx += cos(ang) * flowAccel;
                this.vy += sin(ang) * flowAccel;

                // Lattice attraction — find nearest node within capture radius
                if (this.cooldown <= 0) {
                    let nearest = null;
                    let nd = params.captureRadius;
                    for (let i = 0; i < lattice.length; i++) {
                        const node = lattice[i];
                        const dx = node.x - this.x;
                        const dy = node.y - this.y;
                        const d = sqrt(dx * dx + dy * dy);
                        if (d < nd) { nd = d; nearest = node; }
                    }
                    if (nearest) {
                        const dx = nearest.x - this.x;
                        const dy = nearest.y - this.y;
                        const pull = 0.05 * (1 - nd / params.captureRadius);
                        this.vx += dx * pull;
                        this.vy += dy * pull;

                        if (nd < 5 && this.life > 0.25) {
                            // Capture event
                            pulses.push({ x: nearest.x, y: nearest.y, age: 0 });
                            this.captures++;
                            const speed = sqrt(this.vx * this.vx + this.vy * this.vy);
                            const newAng = random(TWO_PI);
                            this.vx = cos(newAng) * speed * 1.05;
                            this.vy = sin(newAng) * speed * 1.05;
                            this.life *= 0.88;
                            this.cooldown = 6;
                        }
                    }
                } else {
                    this.cooldown--;
                }

                // Damping & speed floor (predictable throughput)
                this.vx *= 0.965;
                this.vy *= 0.965;
                const sp = sqrt(this.vx * this.vx + this.vy * this.vy);
                if (sp < 0.45 && sp > 0) {
                    this.vx = (this.vx / sp) * 0.45;
                    this.vy = (this.vy / sp) * 0.45;
                } else if (sp > 2.4) {
                    this.vx = (this.vx / sp) * 2.4;
                    this.vy = (this.vy / sp) * 2.4;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.life -= params.decay;
            }
            draw() {
                // Primary trail — color migrates from cool flow to warm compute with captures
                const t = constrain(this.captures / 6, 0, 1);
                const c = lerpColor(cCool, cWarm, t);
                c.setAlpha(this.life * 110);
                stroke(c);
                strokeWeight(1.1 + t * 0.6);
                line(this.px, this.py, this.x, this.y);

                // Echo trail — the residual pass
                if (params.echoOffset > 0.05) {
                    const off = params.echoOffset;
                    const ec = color(red(cEcho), green(cEcho), blue(cEcho), this.life * 32);
                    stroke(ec);
                    strokeWeight(0.6);
                    line(this.px + off, this.py + off * 0.7, this.x + off, this.y + off * 0.7);
                }
            }
            alive() {
                return this.life > 0.04 &&
                       this.x > -20 && this.x < width + 20 &&
                       this.y > -20 && this.y < height + 20;
            }
        }

        function draw() {
            // Slow background fade — accumulates topology of utilization
            noStroke();
            fill(250, 249, 245, 9);
            rect(0, 0, width, height);

            // Faint lattice nodes — visible only to the careful eye
            noStroke();
            fill(176, 174, 165, 22);
            for (let i = 0; i < lattice.length; i++) {
                circle(lattice[i].x, lattice[i].y, 1.6);
            }

            // Step + draw particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].step();
                particles[i].draw();
            }
            // Reap and recycle
            particles = particles.filter(p => p.alive());
            while (particles.length < params.particleCount) {
                particles.push(new Particle());
            }

            // Pulses — capture events ringing outward
            const warmR = red(cWarm), warmG = green(cWarm), warmB = blue(cWarm);
            for (let i = 0; i < pulses.length; i++) {
                const p = pulses[i];
                const r = 2 + p.age * 1.6;
                const a = max(0, 70 - p.age * 4.5);
                noFill();
                stroke(warmR, warmG, warmB, a);
                strokeWeight(1);
                circle(p.x, p.y, r);
                p.age++;
            }
            pulses = pulses.filter(p => p.age < 22);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI handlers
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            const v = parseFloat(value);
            params[name] = v;
            const disp = document.getElementById(name + '-value');
            if (disp) disp.textContent = v;
            // Re-init for parameters that change topology
            if (name === 'particleCount' || name === 'latticeSpacing') {
                initializeSystem();
            }
        }

        function updateColor(id, value) {
            const idx = id === 'color1' ? 0 : id === 'color2' ? 1 : 2;
            params.colorPalette[idx] = value;
            document.getElementById(id + '-value').textContent = value;
            cWarm = color(params.colorPalette[0]);
            cCool = color(params.colorPalette[1]);
            cEcho = color(params.colorPalette[2]);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // Seed controls
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }
        function updateSeed() {
            const newSeed = parseInt(document.getElementById('seed-input').value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }
        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }
        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }
        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            const setSlider = (id, val) => {
                const el = document.getElementById(id);
                if (el) { el.value = val; document.getElementById(id + '-value').textContent = val; }
            };
            setSlider('particleCount', params.particleCount);
            setSlider('latticeSpacing', params.latticeSpacing);
            setSlider('flowStrength', params.flowStrength);
            setSlider('captureRadius', params.captureRadius);
            setSlider('echoOffset', params.echoOffset);
            setSlider('decay', params.decay);
            setSlider('noiseScale', params.noiseScale);
            const setColor = (id, val) => {
                document.getElementById(id).value = val;
                document.getElementById(id + '-value').textContent = val;
            };
            setColor('color1', params.colorPalette[0]);
            setColor('color2', params.colorPalette[1]);
            setColor('color3', params.colorPalette[2]);
            cWarm = color(params.colorPalette[0]);
            cCool = color(params.colorPalette[1]);
            cEcho = color(params.colorPalette[2]);
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
